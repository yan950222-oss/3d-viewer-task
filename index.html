<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>3D 展示作業 - 最終修復版</title>
    <script src="https://cdn.babylonjs.com/viewer/babylon.viewer.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f4f4; margin: 0; padding: 20px; }
        .container { background: white; max-width: 800px; margin: auto; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        /* 務必給予明確的高度 */
        #render-box { width: 100%; height: 500px; background: #222; border-radius: 8px; overflow: hidden; }
    </style>
</head>
<body>

    <div class="container">
        <h1>3D 模型展示作業</h1>
        <div id="render-box">
            </div>
    </div>

    <script>
        // 等網頁與 Babylon 腳本完全準備好
        window.addEventListener('load', function() {
            const container = document.getElementById('render-box');
           
            // 使用 JavaScript 手動初始化 Viewer，不依賴 HTML 標籤屬性
            const viewer = new BabylonViewer.DefaultViewer(container, {
                model: {
                    url: "HW2.glb" // 這裡先嘗試相對路徑
                },
                templates: {
                    main: {
                        params: {
                            fillContainer: true
                        }
                    }
                }
            });

            // 監聽載入錯誤，如果相對路徑失效，自動切換到 GitHub 絕對路徑
            viewer.onModelErrorObservable.add((error) => {
                console.warn("相對路徑載入失敗，切換絕對路徑...");
                viewer.loadModel({
                    url: "https://yan950222-oss.github.io/3d-viewer-task/HW2.glb"
                });
            });

            viewer.onModelLoadedObservable.add(() => {
                console.log("模型成功載入並顯示！");
            });
        });
    </script>
</body>
</html>
